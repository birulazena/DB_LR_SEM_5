services:
  postgres:
    image: postgres:18.6
    container_name: db_lr_postgres
    environment:
      POSTGRES_DB: db_lr_postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_lr_postgres_data:/var/lib/postgresql

volumes:
  db_lr_postgres_data: